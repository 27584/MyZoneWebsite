<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="sponsor.pageTitle">MyZone - 赞助</title>
  <!-- 使用站点统一的 Tailwind、DaisyUI 和 Animate.css 依赖。 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: { xl2: '2rem' },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          },
          animation: { float: 'float 6s ease-in-out infinite' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="css/site-chrome.css">
  <style>
    /* ===== 认证交互与页面自用样式 ===== */
    .hidden { display: none !important; }

    #userBtn { position: relative; }

    #loginModal { display: none; position: fixed; inset: 0; z-index: 2000; align-items: flex-start; justify-content: center; padding: 48px 16px 16px; }
    #loginModal.active { display: flex; }
    #loginBackdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .close-btn { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--bc, #000); }
    .error-message { color: var(--er, #dc2626); font-size: 13px; margin-top: 8px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--bc, #d1d5db); border-radius: 8px; font-size: 14px; background: var(--b2, #fff); color: var(--bc, #111); }
    .form-group input:focus { outline: 2px solid var(--p, #4f46e5); outline-offset: -1px; }

    html { scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }

    /* 淡淡的网点背景 */
    .dot-grid {
      background-image: radial-gradient(circle at 1px 1px, var(--bc, #d1d5db) 1px, transparent 0);
      background-size: 28px 28px;
      opacity: .22;
    }

    .feature-card { position: relative; overflow: hidden; }
    .feature-card:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -16px rgba(0,0,0,.18); }

    [data-reveal] { opacity: 0; }
  </style>
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased" data-page="sponsor">
  <!-- 共享头部（由 js/site-chrome.js 注入） -->
  <div id="site-header"></div>

  <main>
    <!-- ===== Hero ===== -->
    <section class="relative overflow-hidden">
      <div class="absolute inset-0 dot-grid pointer-events-none"></div>
      <div class="relative max-w-7xl mx-auto px-6 py-20 lg:py-28 text-center">
        <span class="inline-flex items-center gap-2 badge badge-primary badge-outline badge-lg pl-3 pr-4 py-2 mb-6" data-reveal data-anim="animate__fadeInDown">
          <i data-lucide="heart" class="w-3.5"></i>
          <span data-i18n="sponsor.title">支持 MyZone 发展</span>
        </span>
        <h1 class="text-4xl md:text-5xl xl:text-6xl font-extrabold tracking-tight mb-6 max-w-3xl mx-auto" data-reveal data-anim="animate__fadeInUp" data-i18n="sponsor.subtitle">赞助即表示您对项目的支持，感谢您的慷慨。</h1>
        <div class="flex flex-wrap gap-3 justify-center" data-reveal data-anim="animate__fadeInUp">
          <a href="https://www.ifdian.net/a/Chaohuan" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-lg px-8 shadow-lg shadow-primary/25">
            <span data-i18n="sponsor.supportBtn">前往赞助</span>
            <i data-lucide="arrow-right" class="w-5"></i>
          </a>
          <a href="index.html" class="btn btn-ghost btn-lg btn-outline px-8" data-i18n="nav.about">返回首页</a>
        </div>
      </div>
    </section>

    <!-- ===== PRO 计划 ===== -->
    <section id="pro-plan" class="py-16 lg:py-24 px-6 max-w-6xl mx-auto scroll-mt-20">
      <div class="max-w-md mx-auto">
        <div class="card bg-base-100 border-2 border-primary rounded-2xl p-8 text-center shadow-2xl shadow-primary/10 relative overflow-hidden" data-reveal data-anim="animate__zoomIn">
          <div class="absolute inset-0 opacity-10 dot-grid pointer-events-none"></div>
          <div class="relative">
            <span class="badge badge-primary badge-outline badge-lg mb-5"><i data-lucide="crown" class="w-3.5"></i><span data-i18n="sponsor.proTag">PRO</span></span>
            <p class="text-5xl font-extrabold tracking-tight mb-1">
              <span class="text-primary">¥5</span>
              <span class="text-lg font-medium text-base-content/60" data-i18n="sponsor.priceMonthly">/月</span>
            </p>
            <p class="text-sm text-base-content/50 mt-2 mb-8" data-i18n="sponsor.priceYearly">¥54/年（省10%）</p>
            <ul class="flex flex-col gap-3.5 text-left mb-9">
              <li class="flex items-center gap-3">
                <span class="w-6 h-6 rounded-full bg-success/10 text-success flex items-center justify-center flex-shrink-0"><i data-lucide="check" class="w-4"></i></span>
                <span class="text-sm" data-i18n="sponsor.featureExtAll">订阅所有PRO扩展</span>
              </li>
              <li class="flex items-center gap-3">
                <span class="w-6 h-6 rounded-full bg-success/10 text-success flex items-center justify-center flex-shrink-0"><i data-lucide="check" class="w-4"></i></span>
                <span class="text-sm" data-i18n="sponsor.feature">云空间创建数量不受限</span>
              </li>
            </ul>
            <a href="https://www.ifdian.net/a/Chaohuan" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-lg w-full shadow-lg shadow-primary/25" data-i18n="sponsor.supportBtn">前往赞助</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== 页脚（共享，由 js/site-chrome.js 注入） ===== -->
  <div id="site-footer"></div>

  <!-- ===== 登录弹窗（由 js/site-chrome.js 全站统一注入，含第三方登录） ===== -->
  <div id="loginModal" class="modal-hidden"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/lib/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/site-chrome.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // 初始化 i18n 与图标
    document.addEventListener('DOMContentLoaded', () => {
      if (window.i18n) i18n.init();
      if (window.lucide) lucide.createIcons();
    });
  </script>
  <script>
    // ===== 滚动进场动画（尊重减少动效偏好） =====
    document.addEventListener('DOMContentLoaded', () => {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const els = document.querySelectorAll('[data-reveal]');
      if (reduce) {
        els.forEach(el => el.style.opacity = '1');
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const anim = e.target.getAttribute('data-anim') || 'animate__fadeInUp';
            e.target.classList.add('animate__animated', anim);
            e.target.style.opacity = '1';
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      els.forEach(el => io.observe(el));
    });
  </script>
</body>
</html>
