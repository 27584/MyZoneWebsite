<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.tagline">你的个人空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <h1>MyZone</h1>
      </div>
      <div class="nav-links">
        <a href="#features" data-i18n="nav.features">功能</a>
        <a href="#about" data-i18n="nav.about">关于</a>
        <a href="sponsor.html" data-i18n="nav.sponsor">赞助</a>
      </div>
      <div class="nav-settings">
        <select id="langSelect" class="lang-select">
          <option value="zh" data-i18n="lang.zh">中文</option>
          <option value="en" data-i18n="lang.en">English</option>
        </select>
        <button id="themeToggle" class="theme-toggle" title="切换主题">
          <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="themeIconMoon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
      <div class="nav-auth">
        <button id="loginBtn" class="btn btn-secondary" data-i18n="nav.login">登录</button>
        <button id="signupBtn" class="btn btn-primary" data-i18n="nav.signup">注册</button>
        <div id="userBtn" class="user-btn hidden">
          <span id="userBtnAvatar">U</span>
          <div id="userMenu" class="user-menu hidden">
            <div class="user-info">
              <div class="user-info-avatar" id="userAvatar">U</div>
              <div class="user-info-text">
                <h4 id="userName">用户</h4>
                <p id="userEmail">user@example.com</p>
              </div>
            </div>
            <div class="user-menu-divider"></div>
            <a href="dashboard.html" class="user-menu-item" data-i18n="nav.dashboard">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span data-i18n="nav.dashboard">个人中心</span>
            </a>
            <a href="admin.html" id="adminLink" class="user-menu-item hidden" data-i18n="nav.admin">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <circle cx="12" cy="8" r="3"></circle>
              </svg>
              <span data-i18n="nav.admin">管理后台</span>
            </a>
            <div class="user-menu-divider"></div>
            <button id="logoutBtn" class="user-menu-item danger" data-i18n="nav.logout">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span data-i18n="nav.logout">退出登录</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h2 data-i18n="hero.title">你的个人空间</h2>
        <p data-i18n="hero.subtitle">桌面个人隐私空间，支持加密文件与内置浏览器。</p>
        <div class="hero-actions">
          <button id="heroLoginBtn" class="btn btn-primary" data-i18n="hero.getStarted">立即开始</button>
          <a href="#features" class="btn btn-secondary" data-i18n="hero.learnMore">了解更多</a>
        </div>
      </div>
    </section>

    <section id="features" class="features">
      <h2 data-i18n="features.title">核心功能</h2>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h3 data-i18n="features.security">隐私浏览器</h3>
          <p data-i18n="features.securityDesc">内置安全浏览器，支持多标签与隔离存储。</p>
        </div>
        <div class="feature-card">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="17" width="20" height="5" rx="2" ry="2"></rect>
              <path d="M8 17V7a4 4 0 0 1 8 0v10"></path>
              <path d="M16 22v-4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4"></path>
            </svg>
          </div>
          <h3 data-i18n="features.sync">加密文件系统</h3>
          <p data-i18n="features.syncDesc">本地加密存储，文件内容仅在你的个人空间解密。</p>
        </div>
        <div class="feature-card">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <h3 data-i18n="features.cloud">扩展支持</h3>
          <p data-i18n="features.cloudDesc">支持安装、启用和管理扩展。</p>
        </div>
        <div class="feature-card">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
            </svg>
          </div>
          <h3 data-i18n="features.speed">安全保护</h3>
          <p data-i18n="features.speedDesc">密码锁屏与托盘隐藏，帮助你保护隐私空间。</p>
        </div>
      </div>
    </section>

    <section id="about" class="about">
      <h2 data-i18n="about.title">关于 MyZone</h2>
      <p data-i18n="about.content">桌面个人隐私空间，支持加密文件与内置浏览器。</p>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer.copyright">&copy; 2026 MyZone. All rights reserved.</p>
  </footer>

  <div id="loginModal" class="modal hidden">
    <div id="loginBackdrop" class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <h2 id="modalTitle" data-i18n="auth.login">登录</h2>
      <div class="modal-tabs">
        <button id="tabLogin" class="tab active" data-i18n="auth.login">登录</button>
        <button id="tabSignup" class="tab" data-i18n="auth.signup">注册</button>
      </div>
      <form id="authForm">
        <div class="form-group" id="usernameGroup">
          <label data-i18n="auth.username">用户名</label>
          <input type="text" id="authUsername" name="username" data-i18n-placeholder="auth.placeholder.username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label data-i18n="auth.email">邮箱</label>
          <input type="email" id="authEmail" name="email" data-i18n-placeholder="auth.placeholder.email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label data-i18n="auth.password">密码</label>
          <input type="password" id="authPassword" name="password" data-i18n-placeholder="auth.placeholder.password" placeholder="请输入密码" required>
        </div>
        <div class="form-group" id="confirmPasswordGroup">
          <label data-i18n="auth.confirmPassword">确认密码</label>
          <input type="password" id="authConfirmPassword" name="confirmPassword" data-i18n-placeholder="auth.placeholder.confirmPassword" placeholder="请再次输入密码">
        </div>
        <div id="authError" class="error-message hidden"></div>
        <button type="submit" id="authSubmit" class="btn btn-primary" data-i18n="auth.login">登录</button>
      </form>
    </div>
  </div>

  <script src="js/lib/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const heroLoginBtn = document.getElementById('heroLoginBtn');
      if (heroLoginBtn) {
        heroLoginBtn.addEventListener('click', async () => {
          if (window.appSupabase && window.appSupabase.ensureInitialized) {
            const initialized = await appSupabase.ensureInitialized();
            if (initialized) {
              try {
                const { data, error } = await appSupabase.client.auth.getSession();
                if (!error && data?.session?.user) {
                  window.location.href = 'dashboard.html';
                  return;
                }
              } catch (err) {
                console.error('Session check failed:', err);
              }
            }
          }

          const loginModal = document.getElementById('loginModal');
          if (loginModal) {
            loginModal.classList.remove('hidden');
            loginModal.classList.add('active');
          }
          const tabLogin = document.getElementById('tabLogin');
          if (tabLogin) tabLogin.classList.add('active');
          const tabSignup = document.getElementById('tabSignup');
          if (tabSignup) tabSignup.classList.remove('active');
          const modalTitle = document.getElementById('modalTitle');
          if (modalTitle && window.i18n) modalTitle.textContent = i18n.t('auth.login');
          const authSubmit = document.getElementById('authSubmit');
          if (authSubmit && window.i18n) authSubmit.textContent = i18n.t('auth.login');
          const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
          if (confirmPasswordGroup) confirmPasswordGroup.classList.add('hidden');
          const usernameGroup = document.getElementById('usernameGroup');
          if (usernameGroup) usernameGroup.classList.add('hidden');
        });
      }
    });
  </script>
</body>
</html>
