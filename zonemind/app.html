<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__MSG_extName__</title>
  <style>
    :root {
      --bg: #16181d;
      --surface: #1e2128;
      --surface2: #262a33;
      --surface3: #2f3440;
      --border: #2f3440;
      --border-light: #3a4049;
      --text: #e7e9ee;
      --text-muted: #9aa1ad;
      --text-dim: #6b7380;
      --accent: #3d7bfd;
      --accent-hover: #2f68e8;
      --accent-dim: rgba(61, 123, 253, 0.14);
      --success: #34c77b;
      --warning: #e0a63d;
      --danger: #e25555;
      --user-bubble: #2f6ff0;
      --user-bubble-text: #ffffff;
      --assistant-bubble: #262a33;
      --scrollbar-thumb: #3a4049;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
      --radius: 10px;
      --radius-lg: 14px;
      --radius-sm: 6px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --sidebar-width: 260px;
      --sidebar-collapsed-width: 48px;
    }

    .light-theme {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface2: #f6f8fb;
      --surface3: #ebedf2;
      --border: #e2e6ec;
      --border-light: #d1d5db;
      --text: #1c1f26;
      --text-muted: #6b7380;
      --text-dim: #9ca3af;
      --accent: #3d7bfd;
      --accent-hover: #2f68e8;
      --accent-dim: rgba(61, 123, 253, 0.1);
      --success: #1ea55f;
      --warning: #c98a1b;
      --danger: #d64545;
      --user-bubble: #3d7bfd;
      --user-bubble-text: #ffffff;
      --assistant-bubble: #f0f2f6;
      --scrollbar-thumb: #c6ccd6;
      --shadow: 0 6px 24px rgba(31, 38, 50, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }

    /* ========== App Layout ========== */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ========== Sidebar ========== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s ease;
      overflow: hidden;
    }
    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
      user-select: none;
    }
    .sidebar-title:hover { color: var(--accent); }
    .credits-badge {
      margin-left: auto;
      display: none;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 999px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s ease;
      flex-shrink: 0;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .credits-badge svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
    .credits-badge .credits-text { font-size: 11.5px; line-height: 1; font-weight: 600; letter-spacing: 0.2px; }
    .credits-badge:hover { border-color: var(--accent); color: var(--text); }
    .credits-badge.probing { opacity: 0.6; }
    .sidebar.collapsed .credits-badge { display: none; }
    .sidebar.collapsed .sidebar-new-btn { margin-left: 0; }

    .sidebar-new-btn {
      margin-left: auto;
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .sidebar-new-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .sidebar-new-btn svg { width: 14px; height: 14px; }

    .sidebar.collapsed .sidebar-title { display: none; }
    .sidebar.collapsed .sidebar-new-btn { margin-left: 0; }

    .sidebar-section {
      padding: 12px 10px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .sidebar-section svg { width: 12px; height: 12px; }
    .sidebar-section .section-label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .sidebar.collapsed .sidebar-section .section-label { display: none; }
    .sidebar.collapsed .sidebar-section { justify-content: center; padding: 12px 6px 6px; }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease;
      margin-bottom: 2px;
      position: relative;
    }
    .conv-item:hover { background: var(--surface2); }
    .conv-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .conv-item-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .conv-item.active .conv-item-icon { color: var(--accent); }
    .conv-item-text {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }
    .conv-item-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .conv-item-time {
      display: none;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.85;
    }
    .conv-item:hover .conv-item-time { display: block; }
    .conv-item-actions {
      display: none;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .conv-item:hover .conv-item-actions { display: flex; }
    .conv-item-action {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .conv-item-action:hover { background: rgba(128, 128, 128, 0.18); color: var(--text); }
    .conv-item-action.danger:hover { background: var(--danger); color: #fff; }
    .conv-item-action svg { width: 12px; height: 12px; }

    /* 会话状态徽标（输出中/操作确认/询问/输出完成/已中断） */
    .conv-badge {
      flex-shrink: 0;
      font-size: 10px;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 8px;
      color: #fff;
      white-space: nowrap;
    }
    .conv-item:hover .conv-badge { display: none; }
    .sidebar.collapsed .conv-badge { display: none; }
    .conv-badge.streaming { background: var(--accent); }
    .conv-badge.confirming { background: var(--warning); }
    .conv-badge.asking { background: #8b5cf6; }
    .conv-badge.completed { background: var(--success); }
    .conv-badge.interrupted { background: var(--danger); }

    .sidebar.collapsed .conv-item {
      justify-content: center;
      padding: 8px;
    }
    .sidebar.collapsed .conv-item-main,
    .sidebar.collapsed .conv-item-actions { display: none; }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 10px;
      flex-shrink: 0;
    }

    .work-folder-mini {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease;
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
    }
    .work-folder-mini:hover { background: var(--surface2); color: var(--text); }
    .work-folder-mini svg { width: 14px; height: 14px; flex-shrink: 0; }
    .work-folder-mini .wf-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .sidebar.collapsed .work-folder-mini .wf-name { display: none; }

    /* ========== Main Area ========== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .main-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-toggle {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .sidebar-toggle:hover { background: var(--surface2); color: var(--text); }
    .sidebar-toggle svg { width: 16px; height: 16px; }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--success); }
    .status-dot.err { background: var(--danger); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn svg { width: 15px; height: 15px; }

    /* ========== Chat ========== */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: msgIn 0.18s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }
    .msg.system { align-self: center; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar.user { background: var(--accent-dim); }
    .avatar.user svg, .avatar.assistant svg { width: 16px; height: 16px; }
    .avatar.assistant {
      background: var(--accent-dim);
      color: var(--text);
    }
    .avatar.assistant svg { color: var(--text); }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      color: var(--user-bubble-text);
      border-top-right-radius: 4px;
    }
    .msg.user .bubble .user-text { white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble img.user-img {
      display: block;
      max-width: 260px;
      max-height: 260px;
      border-radius: var(--radius-sm);
      margin-top: 6px;
      cursor: pointer;
    }
    .msg.assistant .bubble {
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    /* ========== Typing indicator ========== */
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
    }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    /* ========== 生成中占位气泡（图片 / 视频） ========== */
    .gen-pending .gen-pending-bubble { min-width: 230px; }
    .gen-pending-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .gen-pending-dots {
      display: inline-flex;
      gap: 3px;
      padding: 2px;
      flex-shrink: 0;
    }
    .gen-pending-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.1s infinite;
    }
    .gen-pending-dots span:nth-child(2) { animation-delay: 0.18s; }
    .gen-pending-dots span:nth-child(3) { animation-delay: 0.36s; }
    .gen-pending-fail-icon {
      width: 18px; height: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
    }
    .gen-pending-sub {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    /* 并发排队状态：模型繁忙时在打字指示气泡内显示排队进度 */
    .queue-status {
      font-size: 13px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 2px;
    }
    .queue-status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      border-top-color: transparent;
      animation: spin 0.9s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== Tool cards ========== */
    .tool-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: visible;
      align-self: flex-start;
      width: 100%;
      max-width: 82%;
      animation: msgIn 0.18s ease;
    }
    .tool-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .tool-card-head svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
    .tool-card-head .tc-label { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tool-card-head .tc-status { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .tc-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); flex-shrink: 0; }
    .tc-status.done .dot { background: var(--success); }
    .tc-status.err .dot { background: var(--danger); }
    .tc-status.denied .dot { background: var(--text-muted); }

    .tool-card-body {
      padding: 9px 12px;
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
      word-break: break-word;
    }
    .tool-card-body .tc-line {
      display: flex;
      gap: 6px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .tool-card-body .tc-line .k { color: var(--text-muted); flex-shrink: 0; }
    .tool-card-body .tc-line .v { color: var(--text); word-break: break-all; white-space: pre-wrap; }

    .tool-card .tc-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      background: var(--surface);
    }
    .tool-card .tc-actions .btn {
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      font-family: var(--font);
      user-select: none;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn svg { width: 15px; height: 15px; }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      flex-shrink: 0;
    }
    .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
    .btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      flex-shrink: 0;
    }
    .btn.danger:hover { opacity: 0.9; color: #fff; }

    .tool-card .tc-warning {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: rgba(224, 166, 61, 0.1);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--warning);
      flex-wrap: wrap;
    }
    .tool-card .tc-warning svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* 工作目录外警告 */
    .tool-card.outside-workdir {
      border-color: var(--danger);
      border-width: 2px;
    }
    .tool-card .tc-outside-warning {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.1);
      border-bottom: 1px solid rgba(239, 68, 68, 0.2);
      font-size: 12px;
      color: var(--danger);
      font-weight: 500;
    }
    .tool-card .tc-outside-warning svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* 思考过程 */
    .thinking-bubble {
      background: var(--surface) !important;
      border: 1px dashed var(--border);
    }
    .thinking-bubble .thinking-header {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .thinking-bubble .thinking-icon { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .thinking-bubble .thinking-title { font-size: 12px; font-weight: 500; color: var(--text-muted); flex: 1; }
    .thinking-bubble .thinking-toggle { font-size: 11px; color: var(--text-dim); }
    .thinking-bubble .thinking-body {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .thinking-bubble .thinking-body p { margin: 0.4em 0; }

    /* ========== Notice ========== */
    .notice {
      margin: 10px 0;
      padding: 12px 14px;
      border: 1px solid var(--warning);
      border-radius: var(--radius);
      background: rgba(224, 166, 61, 0.08);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex-shrink: 0;
    }
    .notice svg { width: 18px; height: 18px; color: var(--warning); flex-shrink: 0; margin-top: 1px; }
    .notice .notice-title { font-weight: 600; margin-bottom: 2px; }
    .notice .notice-desc { font-size: 12.5px; color: var(--text-muted); }
    .notice .btn { margin-top: 8px; border-color: var(--warning); color: var(--warning); }
    .notice .btn:hover { background: rgba(224, 166, 61, 0.12); }

    /* 完全放行模式常驻黄色警示 */
    .approval-warning {
      flex-shrink: 0;
      margin: 8px 24px 0;
      padding: 8px 14px;
      border: 1px solid var(--warning);
      border-radius: var(--radius);
      background: rgba(224, 166, 61, 0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }
    .approval-warning svg { width: 16px; height: 16px; color: var(--warning); flex-shrink: 0; }
    .approval-warning .approval-warning-title { color: var(--warning); font-weight: 600; flex-shrink: 0; }
    .approval-warning .approval-warning-desc { color: var(--text-muted); }
    .approval-selector.warn {
      border-color: var(--warning);
      background: rgba(224, 166, 61, 0.12);
    }
    .approval-selector.warn .approval-name { color: var(--warning); font-weight: 600; }

    /* ========== Markdown body ========== */
    .markdown-body { line-height: 1.65; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      margin: 0.8em 0 0.4em;
      font-weight: 600;
      line-height: 1.3;
    }
    .markdown-body h1 { font-size: 1.5em; }
    .markdown-body h2 { font-size: 1.3em; }
    .markdown-body h3 { font-size: 1.15em; }
    .markdown-body h4 { font-size: 1.05em; }
    .markdown-body p { margin: 0.5em 0; }
    .markdown-body strong { font-weight: 600; }
    .markdown-body em { font-style: italic; }
    .markdown-body del { text-decoration: line-through; opacity: 0.7; }
    .markdown-body ul, .markdown-body ol {
      margin: 0.5em 0;
      padding-left: 1.4em;
    }
    .markdown-body li { margin: 0.2em 0; }
    .markdown-body blockquote {
      margin: 0.6em 0;
      padding: 0.4em 1em;
      border-left: 3px solid var(--accent);
      background: var(--surface2);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-muted);
    }
    .markdown-body code {
      padding: 1px 6px;
      background: var(--surface2);
      border-radius: 4px;
      font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
      font-size: 0.9em;
    }
    .markdown-body pre {
      margin: 0.8em 0;
      padding: 12px 14px;
      background: var(--surface2);
      border-radius: var(--radius);
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    .markdown-body pre code {
      padding: 0;
      background: transparent;
      font-size: 0.88em;
      line-height: 1.5;
      display: block;
    }
    .markdown-body a { color: var(--accent); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body table {
      margin: 0.8em 0;
      border-collapse: collapse;
      width: 100%;
      font-size: 0.9em;
    }
    .markdown-body th, .markdown-body td {
      padding: 6px 10px;
      border: 1px solid var(--border);
      text-align: left;
    }
    .markdown-body th {
      background: var(--surface2);
      font-weight: 600;
    }
    .markdown-body img {
      max-width: 100%;
      width: auto;
      height: auto;
      display: block;
      border-radius: var(--radius);
      margin: 0.5em 0;
      background: var(--surface2);
    }
    .markdown-body video {
      max-width: 100%;
      width: 100%;
      max-height: 70vh;
      border-radius: var(--radius);
      margin: 0.5em 0;
      background: #000;
    }
    /* 图片/视频加载失败：替代碎片图标的提示块，直接给可用的外链 */
    .media-fallback {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin: 0.5em 0;
      background: var(--warning-bg, rgba(224,166,61,0.1));
      border: 1px solid var(--warning-border, rgba(224,166,61,0.3));
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text);
      max-width: 100%;
    }
    .media-fallback .mf-icon { font-size: 14px; flex-shrink: 0; }
    .media-fallback .mf-title { color: var(--text); font-weight: 600; }
    .media-fallback .mf-link {
      color: var(--accent);
      margin-left: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1em 0;
    }

    /* ========== Examples ========== */
    .examples {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }
    .example-chip {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      text-align: left;
      font-family: var(--font);
    }
    .example-chip:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* ========== Composer ========== */
    .composer-area {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .composer-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .toolbar-group {
      position: relative; /* 为内部绝对定位的下拉框提供定位上下文，避免渲染到可视区外 */
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toolbar-label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-right: 4px;
    }

    .model-selector {
      position: relative; /* 为下拉框提供定位上下文，避免渲染到可视区外 */
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 12px;
    }
    .model-selector:hover { border-color: var(--accent); }
    .model-selector .model-icon { width: 14px; height: 14px; color: var(--accent); }
    .model-selector .model-name {
      max-width: 120px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .model-selector .model-arrow { width: 10px; height: 10px; color: var(--text-dim); }

    .approval-selector {
      position: relative; /* 为下拉框提供定位上下文 */
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 12px;
    }
    .approval-selector:hover { border-color: var(--accent); }
    .approval-selector .approval-name {
      max-width: 80px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .approval-selector .approval-arrow { width: 10px; height: 10px; color: var(--text-dim); }
    .approval-dropdown {
      position: absolute;
      bottom: calc(100% + 6px); /* 工具栏贴近底部，向上展开避免溢出可视区 */
      top: auto;
      left: 0;
      min-width: 132px;
      max-height: 240px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 50;
      display: none;
    }
    .approval-dropdown.visible { display: block; }
    .approval-dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .approval-dropdown-item:hover { background: var(--surface2); }
    .approval-dropdown-item.active { color: var(--accent); }
    .approval-dropdown-item .check { width: 12px; height: 12px; }

    .composer {
      position: relative; /* 斜杠菜单定位锚点 */
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px;
    }

    /* ========== 插图附件（多模态输入） ========== */
    .attach-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 16px 0;
    }
    .attach-preview[hidden] { display: none; }
    .attach-cell {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface2);
    }
    .attach-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .attach-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 12px;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .attach-remove::before { content: '×'; }
    .attach-remove:hover { background: rgba(239, 68, 68, 0.85); }
    .composer .btn.attach-add {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: 1px;
    }
    .composer .btn.attach-add:hover { color: var(--accent); background: var(--surface2); }
    .composer .btn.attach-add .aa-icon { width: 17px; height: 17px; }

    /* 文本/代码文件附件卡片 */
    .attach-cell-file {
      width: auto;
      min-width: 140px;
      max-width: 220px;
      padding: 0 8px 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
    }
    .attach-file-icon {
      width: 16px;
      height: 20px;
      flex-shrink: 0;
      border: 1px solid var(--text-muted);
      border-radius: 2px;
      position: relative;
      opacity: 0.85;
    }
    .attach-file-icon::after {
      content: '';
      position: absolute;
      top: -1px;
      right: -1px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 5px 5px;
      border-color: transparent transparent var(--surface2) var(--text-muted);
    }
    .attach-file-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--text);
    }
    .attach-file-size {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-muted);
    }
    .attach-cell-file .attach-remove { position: static; width: 16px; height: 16px; margin-left: 2px; }

    /* ========== 附件来源菜单 ========== */
    .attach-wrap { position: relative; flex-shrink: 0; }
    .attach-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      min-width: 148px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 60;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .attach-menu[hidden] { display: none; }
    .attach-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .attach-menu-item:hover { background: var(--surface2); color: var(--accent); }

    /* ========== 斜杠命令菜单（/技能） ========== */
    .slash-menu {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(100% + 8px);
      max-height: 45vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 60;
      padding: 6px;
    }
    .slash-menu[hidden] { display: none; }
    .slash-menu-title {
      padding: 4px 8px;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .slash-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      font-size: 12px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--text);
    }
    .slash-menu-item:hover, .slash-menu-item.active { background: var(--surface2); color: var(--accent); }
    .slash-menu-item .smi-icon { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
    .slash-menu-item .smi-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slash-menu-item .smi-desc { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
    .slash-menu-empty { padding: 12px; font-size: 12px; color: var(--text-muted); text-align: center; }

    /* ========== 技能栏（豆包式底部技能） ========== */
    .toolbar-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font);
      transition: all 0.15s ease;
    }
    .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar-btn .tb-icon { width: 13px; height: 13px; color: var(--accent); }
    .skill-dropdown {
      position: absolute;
      bottom: calc(100% + 6px); /* 工具栏贴近底部，向上展开避免溢出可视区 */
      top: auto;
      left: 0;
      min-width: 150px;
      max-height: 60vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 55;
      padding: 4px;
      display: none;
    }
    .skill-dropdown.visible { display: block; }
    .skill-dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--text);
    }
    .skill-dropdown-item:hover { background: var(--surface2); color: var(--accent); }
    .skill-dropdown-item .sd-icon { width: 15px; height: 15px; color: var(--accent); }

    .skill-bar {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 0;
    }
    .skill-bar.active { display: flex; }
    .skill-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 10px;
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }
    .skill-chip .sc-label { display: flex; align-items: center; gap: 5px; }
    .skill-chip .sc-icon { width: 13px; height: 13px; }
    .skill-chip .sc-model {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
      position: relative;
      max-width: 160px;
    }
    /* 省略号只作用于模型名称文字；容器不可裁剪，否则绝对定位的模型下拉会被裁掉 */
    .skill-chip .sc-model > span:first-child {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .skill-chip .sc-model:hover { border-color: var(--accent); color: var(--accent); }
    .skill-chip .sc-model-arrow { width: 9px; height: 9px; color: var(--text-dim); flex-shrink: 0; }
    .skill-chip .sc-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      border: none;
    }
    .skill-chip .sc-close:hover { background: var(--surface2); color: var(--danger); }
    .skill-chip .sc-close svg { width: 11px; height: 11px; }
    .skill-model-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      min-width: 200px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 58;
      padding: 4px;
      display: none;
      max-height: 240px;
      overflow-y: auto;
      white-space: nowrap;
    }
    .skill-model-menu.visible { display: block; }
    .skill-model-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 9px;
      font-size: 12px;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .skill-model-item:hover { background: var(--surface2); }
    .skill-model-item.active { background: var(--accent-dim); }
    .skill-model-item.active .smi-name { color: var(--accent); font-weight: 600; }
    .skill-model-item .smi-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .smi-cost { font-size: 11px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
    .smi-cost .smi-orig { text-decoration: line-through; margin-left: 4px; }

    /* 生成参数选择按钮（图片尺寸/比例；视频时长/画幅） */
    .skill-chip .sc-param {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
      position: relative;
    }
    .skill-chip .sc-param:hover { border-color: var(--accent); color: var(--accent); }
    .skill-chip .sc-param .scp-key { color: var(--text-muted); }
    .skill-chip .sc-param .scp-val { font-weight: 600; color: var(--accent); }
    .skill-chip .sc-param .sc-model-arrow { width: 8px; height: 8px; color: var(--text-dim); flex-shrink: 0; }
    .skill-param-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 58;
      padding: 4px;
      display: none;
      max-height: 220px;
      overflow-y: auto;
      white-space: nowrap;
    }
    .skill-param-menu.visible { display: block; }
    .skill-param-menu .scp-item {
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .skill-param-menu .scp-item:hover { background: var(--surface2); color: var(--accent); }
    .skill-param-menu .scp-item.active { color: var(--accent); font-weight: 600; }

    .composer textarea {
      flex: 1;
      min-height: 76px;
      max-height: 140px;
      resize: none;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .composer textarea::placeholder { color: var(--text-muted); }
    .composer textarea:focus { border-color: var(--accent); }
    .composer .btn.send {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      padding: 9px 14px;
      border-radius: var(--radius);
      flex-shrink: 0;
    }
    .composer .btn.send:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
    .composer .btn.stop {
      display: none;
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
      padding: 9px 14px;
      border-radius: var(--radius);
      flex-shrink: 0;
      align-items: center;
      gap: 6px;
    }
    .composer .btn.stop:hover { background: rgba(239, 68, 68, 0.1); }
    .composer .btn.stop svg { width: 14px; height: 14px; }

    /* 询问面板激活时隐藏输入框与发送/停止按钮（面板替换输入区） */
    .composer.ask-active #input,
    .composer.ask-active #send-btn,
    .composer.ask-active #stop-btn { display: none; }

    /* ========== Settings Panel ========== */
    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      max-width: 90vw;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.3);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    .settings-panel.open { transform: translateX(0); }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .settings-header h3 { font-size: 15px; font-weight: 600; }
    .settings-close {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
    }
    .settings-close:hover { background: var(--surface2); color: var(--text); }
    .settings-close svg { width: 16px; height: 16px; }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .settings-section {
      margin-bottom: 24px;
    }
    .settings-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .skill-list { display: flex; flex-direction: column; gap: 10px; }
    .settings-btn {
      border: 1px solid var(--accent); color: var(--accent);
      background: transparent; border-radius: var(--radius-sm);
      padding: 7px 12px; font-size: 12px; cursor: pointer;
    }
    .settings-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .settings-btn.danger { border-color: var(--danger); color: var(--danger); }
    .settings-btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
    .agent-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .agent-tab {
      border: 1px solid var(--border); background: var(--surface2);
      border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px;
      cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 5px;
    }
    .agent-tab:hover { border-color: var(--accent); }
    .agent-tab.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .agent-editor {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface2); padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .agent-editor-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .agent-editor-title-wrap { display: inline-flex; align-items: center; min-width: 0; }
    .agent-editor-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .agent-editor-meta { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .agent-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .agent-field input, .agent-field textarea {
      width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 9px; font-size: 12.5px;
    }
    .agent-field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
    .dev-toggle-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .dev-toggle-item > input { margin-top: 3px; accent-color: var(--accent); }
    .dev-toggle-item > span {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .dev-toggle-title { font-size: 13px; color: var(--text); }
    .dev-toggle-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    /* 请求详情（开发者模式）：用户消息下方可折叠的「实际发送消息」面板 */
    /* 独立中性底 + 高对比文字，避免叠在蓝色用户气泡上看不清 */
    .req-detail {
      margin-top: 8px; padding: 6px 10px 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .ctx-compressed {
      margin: 6px auto; padding: 2px 12px; width: fit-content; max-width: 90%;
      font-size: 11px; line-height: 1.6; text-align: center;
      color: var(--text-dim); border: 1px dashed var(--border); border-radius: var(--radius-sm);
    }
    .req-detail-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 6px 2px; background: none; border: none; cursor: pointer;
      font-size: 12px; color: var(--text); text-align: left;
    }
    .req-detail-head .rd-chev { width: 12px; height: 12px; flex: none; transition: transform 0.15s; }
    .req-detail.open .rd-chev { transform: rotate(90deg); }
    .req-detail-body { display: none; }
    .req-detail.open .req-detail-body { display: block; }
    .rd-meta { font-size: 12px; color: var(--text-muted); margin: 4px 0 6px; }
    .rd-msg {
      margin-bottom: 6px; padding: 6px 8px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
      font-family: var(--font-mono, monospace); font-size: 12px; line-height: 1.55;
      color: var(--text); white-space: pre-wrap; word-break: break-word;
    }
    /* 失败请求详情（可折叠）：呈现 HTTP 状态 + 完整响应体 */
    .err-detail {
      margin-top: 8px; padding: 6px 10px 8px;
      background: var(--bg); border: 1px solid var(--danger); border-radius: var(--radius-sm);
    }
    .err-detail-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 6px 2px; background: none; border: none; cursor: pointer;
      font-size: 12px; color: var(--danger); text-align: left;
    }
    .err-detail-head .ed-chev { width: 12px; height: 12px; flex: none; transition: transform 0.15s; }
    .err-detail.open .ed-chev { transform: rotate(90deg); }
    .err-detail-body {
      display: none; margin-top: 2px; max-height: 240px; overflow: auto;
      padding: 8px 10px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
      font-family: var(--font-mono, monospace); font-size: 12px; line-height: 1.55;
      color: var(--text); white-space: pre-wrap; word-break: break-word;
    }
    .err-detail.open .err-detail-body { display: block; }
    .rd-msg .rd-head { color: var(--text-muted); font-weight: 600; }
    .rd-flag { color: var(--accent); font-weight: 600; }
    .rd-preview { opacity: 0.7; }
    .rd-full { display: none; }
    .rd-msg.open .rd-preview { display: none; }
    .rd-msg.open .rd-full { display: block; }
    .rd-expand {
      margin-top: 6px; padding: 2px 8px; font-size: 11px; line-height: 1.5;
      background: var(--surface2); color: var(--accent);
      border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
    }
    .rd-tool-title { font-size: 12px; color: var(--text-muted); margin: 4px 0 2px; }
    .rd-tool-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .rd-tool {
      font-family: var(--font-mono, monospace); font-size: 11px; line-height: 1.4;
      color: var(--accent); background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 1px 5px;
    }
    .skill-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
    }
    .skill-item.disabled { opacity: 0.6; }
    .skill-item-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .skill-item input[type="checkbox"], .tool-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      accent-color: var(--accent);
    }
    .skill-item-title { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; }
    .skill-item-cost {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface3);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .skill-item-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .skill-item-tools {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
      padding-left: 2px;
    }
    .tool-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      cursor: pointer;
      padding: 2px 0;
    }
    .tool-item-name { flex: 1; min-width: 0; }
    .tool-item-cost {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .mcp-list { display: flex; flex-direction: column; gap: 10px; }
    .mcp-server {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mcp-server.disabled { opacity: 0.6; }
    .mcp-server-head { display: flex; align-items: center; gap: 8px; }
    .mcp-server-icon { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
    .mcp-server-name { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; line-height: 1.35; word-break: break-all; }
    .mcp-server-offline {
      font-size: 10px;
      color: var(--warning, #c98a2e);
      border: 1px solid var(--warning, #c98a2e);
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 2px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mcp-server-tools { display: flex; flex-direction: column; gap: 4px; }
    .cfg-toggle {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
      margin-left: 2px;
    }
    .cfg-toggle:hover { background: rgba(128, 128, 128, 0.18); color: var(--text); }
    .cfg-toggle svg { width: 13px; height: 13px; transition: transform 0.15s ease; }
    .cfg-toggle.collapsed svg { transform: rotate(-90deg); }
    .skill-item.collapsed .skill-item-desc,
    .skill-item.collapsed .skill-item-tools { display: none; }
    .mcp-server.collapsed .mcp-server-tools { display: none; }
    .skill-item-badge {
      font-size: 10px;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 6px;
      vertical-align: 1px;
    }
    .skill-item-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.5;
    }
    .settings-model-hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
    }
    .settings-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ========== Modal ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: msgIn 0.2s ease;
    }
    .modal-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 600;
    }
    .modal-body { padding: 16px 18px; }
    .modal-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .credits-detail-table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      table-layout: fixed;   /* 固定列宽，长文本折行/截断而非撑宽表格引发横向滚动条 */
      word-break: break-word;
    }
    .credits-detail-table th,
    .credits-detail-table td {
      padding: 7px 9px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;   /* 配合 table-layout:fixed + 固定列宽，超长内容截断为省略号而非撑宽表格 */
      vertical-align: middle;
    }
    .credits-detail-table th:first-child, .credits-detail-table td:first-child { width: 118px; }
    .credits-detail-table th:nth-child(2), .credits-detail-table td:nth-child(2) { width: auto; }
    .credits-detail-table th:nth-child(3), .credits-detail-table td:nth-child(3) { width: 230px; }
    .credits-detail-table th:nth-child(4), .credits-detail-table td:nth-child(4) { width: 84px; text-align: right; }
    .credits-detail-table th {
      color: var(--text-dim);
      font-weight: 600;
      background: var(--surface2);
    }
    .credits-detail-table td:first-child { color: var(--text-muted); }
    .credits-detail-table tr:last-child td { border-bottom: none; }
    .credits-detail-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .credits-detail-info {
      font-size: 12px;
      color: var(--text-muted);
    }
    .credits-more-btn {
      height: 28px;
      padding: 0 14px;
      font-size: 12px;
      line-height: 1;
      width: auto;
      min-width: 76px;
      margin-left: auto;
    }
    .credits-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* credits 信息区（弹窗顶部）：余额总览 + 获得记录卡 */
    .credits-info { margin-bottom: 6px; }
    .credits-info-overview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-surface-2, rgba(128,128,128,0.08));
      border-radius: 10px;
    }
    .credits-info-balance { display: flex; flex-direction: column; line-height: 1.2; }
    .credits-info-balance-num { font-size: 26px; font-weight: 700; }
    .credits-info-balance-label { font-size: 12px; color: var(--text-muted); }
    .credits-info-stats { display: flex; gap: 18px; }
    .credits-info-stats > div { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
    .credits-info-stats span { font-size: 12px; color: var(--text-muted); }
    .credits-info-stats b { font-size: 15px; }
    .credits-info-heading {
      font-size: 13px; font-weight: 600;
      margin: 14px 0 8px;
    }
    .credits-grants { display: flex; flex-direction: column; gap: 8px; }
    .credits-grant {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .credits-grant.expired { opacity: 0.55; }
    .credits-grants-collapse { display: flex; flex-direction: column; gap: 8px; }
    .credits-grants-collapse-toggle {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 8px 4px;
      border: none; background: none;
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      cursor: pointer;
    }
    .credits-grants-collapse-toggle:hover { color: var(--text); }
    .credits-grants-collapse-icon {
      width: 16px; height: 16px; flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .credits-grants-collapse.expanded .credits-grants-collapse-icon { transform: rotate(180deg); }
    .credits-grants-collapsed { display: flex; flex-direction: column; gap: 8px; }
    .credits-grants-collapsed[hidden] { display: none; }
    .credits-grant-main {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .credits-grant-remark { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .credits-grant-amount { font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .credits-grant-meta, .credits-grant-usage { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .credits-info-empty { font-size: 12px; color: var(--text-muted); }

    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text-dim); }

    /* ========== Model Dropdown ========== */
    .model-dropdown {
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 6px;
      min-width: 300px;
      max-height: 240px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 50;
      display: none;
    }
    .model-dropdown.visible { display: block; }
    .model-dropdown-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.1s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .model-dropdown-item:hover { background: var(--surface2); }
    .model-dropdown-item.active { color: var(--accent); background: var(--accent-dim); }
    .model-dropdown-item .check { width: 14px; height: 14px; margin-left: auto; }
    .model-dropdown-group {
      padding: 6px 12px 3px;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }
    .model-dropdown-item .rate-badge {
      font-size: 10.5px;
      line-height: 1;
      color: var(--text-muted);
      background: var(--bg-surface-2, rgba(128, 128, 128, 0.12));
      border-radius: 4px;
      padding: 2px 5px;
      margin-left: 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .model-dropdown-item .rate-badge .rate-orig {
      color: var(--text-dim);
    }
    .model-dropdown-item .builtin-badge {
      font-size: 10px;
      line-height: 14px;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .model-dropdown-item .auto-badge {
      font-size: 10px;
      line-height: 14px;
      font-weight: 600;
      color: var(--warning);
      border: 1px solid var(--warning);
      background: color-mix(in srgb, var(--warning) 10%, transparent);
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .model-dropdown-item .discount-badge {
      font-size: 10px;
      line-height: 14px;
      font-weight: 600;
      color: #0a7a3d;
      border: 1px solid rgba(10, 122, 61, 0.45);
      background: rgba(10, 122, 61, 0.08);
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    /* 深色主题下折扣徽标配色 */
    html[data-theme='dark'] .model-dropdown-item .discount-badge {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.45);
      background: rgba(74, 222, 128, 0.12);
    }

    /* ========== 模型徽标自定义 tooltip ========== */
    .model-badge-tip {
      position: fixed;
      z-index: 300;
      max-width: 70vw;
      padding: 5px 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      font-size: 11px;
      line-height: 1.4;
      color: var(--text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .model-badge-tip s {
      color: var(--text-dim);
      text-decoration: line-through;
    }
    .model-badge-tip .tip-unit {
      color: var(--text-dim);
    }

    /* ========== Token 用量 ========== */
    .token-usage {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ========== 上下文圆环 / 额度 ========== */
    .meta-gauges {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .context-ring-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      cursor: pointer;
    }
    /* 手动压缩按钮：上下文圆环旁的小图标按钮，仅在有历史可压缩时显示 */
    .ctx-compress-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      border-radius: var(--radius-sm);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .ctx-compress-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ctx-compress-btn .cc-icon { width: 13px; height: 13px; }
    /* 压缩进行中：图标替换为旋转加载圈，禁用防重复触发 */
    .ctx-compress-btn .cc-spinner {
      display: none;
      width: 13px;
      height: 13px;
      border: 1.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: ctx-spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .ctx-compress-btn.compressing .cc-icon { display: none; }
    .ctx-compress-btn.compressing .cc-spinner { display: block; }
    .ctx-compress-btn:disabled { opacity: 0.65; cursor: default; }
    @keyframes ctx-spin { to { transform: rotate(360deg); } }
    /* 悬停效果作用在圆环（ctx-tooltip 的兄弟节点）上，不能作用在 wrap 自身：
       wrap 一旦带 transform/filter，就会成为内部 fixed 定位 ctx-tooltip 的包含块，
       基于视口的坐标会相对 40×40 的 wrap 偏移到屏外，tooltip 完全不可见。 */
    .context-ring-wrap:hover .context-ring {
      filter: brightness(1.12);
    }
    .context-ring {
      width: 40px;
      height: 40px;
      transform: rotate(-90deg);
      transition: filter 0.25s ease;
    }
    .context-ring .rg-bg {
      fill: none;
      stroke: var(--surface3);
      stroke-width: 4;
    }
    .context-ring .rg-fg {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 94.25;
      stroke-dashoffset: 94.25;
      transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s ease;
    }
    .context-ring .rg-fg.dim { stroke: var(--border); }
    .context-ring-wrap.warn .rg-fg { stroke: var(--warning); }
    .context-ring-wrap.probing .context-ring { animation: ri 1s ease-in-out infinite; }
    @keyframes ri {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .context-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }
    .context-pct {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .context-sub {
      font-size: 8px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      max-width: 34px;
      overflow: hidden;
      white-space: nowrap;
    }
    .quota-text {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .ctx-tooltip {
      position: fixed;
      z-index: 300;
      padding: 4px 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      font-size: 11px;
      line-height: 1.4;
      color: var(--text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s;
      pointer-events: none;
    }
    .ctx-tooltip.show {
      opacity: 1;
      visibility: visible;
    }

    /* ========== 消息级悬停操作 ========== */
    .msg {
      position: relative;
    }
    .msg-hover {
      position: absolute;
      bottom: -14px;
      left: 0;
      display: none;
      align-items: center;
      gap: 2px;
      padding: 2px 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 5;
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .msg.user .msg-hover { right: 0; left: auto; }
    .msg:hover .msg-hover, .msg:focus-within .msg-hover { display: flex; }
    .msg-time { padding: 0 4px; }
    .msg-hover-btn {
      width: 22px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .msg-hover-btn svg { width: 13px; height: 13px; }
    .msg-hover-btn:hover { background: rgba(128, 128, 128, 0.18); color: var(--text); }
    .msg-hover-btn.danger:hover { background: var(--danger); color: #fff; }

    /* ========== 标题编辑 ========== */
    .header-title { cursor: text; }
    .title-input {
      flex: 1;
      min-width: 0;
      padding: 2px 6px;
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      outline: none;
      font-family: var(--font);
    }

    /* ========== 工具卡片折叠 ========== */
    .tc-toggle {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
      margin-left: 2px;
    }
    .tc-toggle:hover { background: rgba(128, 128, 128, 0.18); color: var(--text); }
    .tc-toggle svg { width: 13px; height: 13px; transition: transform 0.15s ease; }
    .tc-toggle.collapsed svg { transform: rotate(-90deg); }
    .tool-card-body.collapsed { display: none; }

    /* ========== 询问用户模态（ask_user） ========== */
    .ask-panel {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .ask-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ask-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .ask-progress {
      min-width: 34px;
      margin-left: auto;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      white-space: nowrap;
    }
    .ask-close {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
    }
    .ask-close:hover { color: var(--text); }

    /* 步骤滑动容器：步骤使用绝对定位铺满，JS 控制高度与过渡 */
    .ask-stage {
      position: relative;
      overflow: hidden;
      margin-top: 4px;
    }
    .ask-step {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
    }
    .ask-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .ask-foot .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .ask-question {
      margin: 6px 0 12px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ask-options-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .ask-option {
      border: 1px solid var(--border-light);
      background: var(--surface2);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .ask-option:hover { border-color: var(--accent); }
    .ask-option.selected {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .ask-other { margin-top: 12px; }
    .ask-other .ask-other-input { display: none; }
    .ask-other.active .ask-other-input { display: block; margin-top: 8px; }
    .ask-input {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface2);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      font-family: var(--font);
      resize: vertical;
    }
    .ask-input:focus { outline: none; border-color: var(--accent); }
    .ask-note { margin-top: 12px; }
    .ask-note-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    /* ========== Responsive ========== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar.collapsed { width: 0; border-right: none; }
      .sidebar-title, .sidebar-section .section-label, .conv-item-text, .work-folder-mini .wf-name { display: none; }
      .sidebar-new-btn { margin-left: 0; }
      .sidebar-header, .sidebar-section { justify-content: center; }
      .conv-item { justify-content: center; padding: 8px; }
      .conv-item-actions { display: none !important; }
      .main-header { padding: 8px 12px; }
      .header-title { font-size: 13px; }
      .chat { padding: 12px 14px 8px; }
      .msg, .tool-card { max-width: 94%; }
      .composer { padding: 10px 12px; gap: 8px; }
      .composer textarea { font-size: 13px; padding: 8px 10px; }
      .composer .btn.send { padding: 8px 12px; font-size: 13px; }
      .bubble { padding: 8px 12px; font-size: 13px; }
      .tool-card-head { padding: 8px 10px; font-size: 12px; }
      .tool-card-body { padding: 8px 10px; font-size: 12px; }
      .tool-card .tc-actions { padding: 8px 10px; gap: 6px; }
      .tool-card .tc-actions .btn { flex: 1; min-width: 70px; justify-content: center; }
      .composer-toolbar { padding: 6px 12px; font-size: 11px; }
      .model-selector .model-name { max-width: 80px; }
      .settings-panel { width: 100%; max-width: 100%; }
    }

    @media (max-width: 480px) {
      .header-actions .icon-btn span { display: none; }
      .model-selector .model-icon { display: none; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <!-- ========== Sidebar ========== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title" id="zonemind-title" data-i18n="title" role="button" tabindex="0" title="点击铺开或还原页面"></div>
        <button class="credits-badge" id="credits-badge" title="__MSG_creditsDetailTitle__" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="5.4"/>
            <path d="M18.09 10.37A6 6 0 1 1 10.34 18"/>
            <path d="M7 6.2h1.2v3.6"/>
            <path d="m16.6 14 .8.8-2.9 2.9"/>

          <span class="credits-text" id="credits-text">--</span>
        </button>
        <button class="sidebar-new-btn" id="new-conv-btn" title="__MSG_newConversation__">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="section-label" data-i18n="conversationList"></span>
      </div>

      <div class="conversation-list" id="conversation-list"></div>

      <div class="sidebar-footer">
        <div class="work-folder-mini" id="work-folder" title="__MSG_chooseFolder__">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          </svg>
          <span class="wf-name" id="work-folder-name">__MSG_workFolderRoot__</span>
        </div>
      </div>
    </aside>

    <!-- ========== Main Area ========== -->
    <main class="main">
      <header class="main-header">
        <button class="sidebar-toggle" id="sidebar-toggle" title="__MSG_toggleSidebar__">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 3v18"/>
          </svg>
        </button>
        <div class="header-info">
          <div class="header-title" id="conv-title" data-i18n="newConversation"></div>
          <div class="status-line">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">__MSG_statusTesting__</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="clear-btn" title="__MSG_clearConversation__">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
            </svg>
          </button>
          <button class="icon-btn" id="settings-btn" title="__MSG_settings__">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="notice hidden" id="not-configured">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l10 18H2L12 3z"/>
          <path d="M12 10v4"/>
          <path d="M12 17h.01"/>
        </svg>
        <div>
          <div class="notice-title" data-i18n="notConfiguredTitle"></div>
          <div class="notice-desc" data-i18n="notConfiguredDesc"></div>
          <button class="btn" id="check-again-btn"><span data-i18n="checkAgain"></span></button>

      <div class="approval-warning hidden" id="approval-warning">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l10 18H2L12 3z"/>
          <path d="M12 10v4"/>
          <path d="M12 17h.01"/>
        </svg>
        <span class="approval-warning-title" data-i18n="approvalFull"></span>
        <span class="approval-warning-desc" data-i18n="approvalFullWarning"></span>
      </div>

      <main class="chat" id="chat"></main>

      <div class="composer-area">
        <div class="composer-toolbar">
          <div class="toolbar-group">
            <span class="toolbar-label" data-i18n="modelLabel"></span>
            <div class="model-selector" id="model-selector" title="__MSG_selectModel__">
