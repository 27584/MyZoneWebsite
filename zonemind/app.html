                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
              <span class="model-name" id="current-model-name">--</span>
              <svg class="model-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
              <div class="model-dropdown" id="model-dropdown"></div>
            </div>
          </div>
          <!-- 手动技能入口（豆包式底部技能） -->
          <div class="toolbar-group">
            <button class="toolbar-btn" id="skill-btn" title="__MSG_skillAdd__">
              <svg class="tb-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/>
                <circle cx="12" cy="12" r="3.2"/>
              </svg>
              <span data-i18n="skillAdd"></span>
            </button>
            <div class="skill-dropdown" id="skill-dropdown">
              <div class="skill-dropdown-item" data-mode="image">
                <svg class="sd-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <path d="M21 15l-5-5L5 21"/>
                </svg>
                <span data-i18n="manualImageGen"></span>
              </div>
              <div class="skill-dropdown-item" data-mode="video">
                <svg class="sd-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="5" width="14" height="14" rx="2"/>
                  <path d="M22 8l-6 4 6 4V8z"/>
                </svg>
                <span data-i18n="manualVideoGen"></span>
              </div>
            </div>
          </div>
          <div class="toolbar-group">
            <span class="toolbar-label" data-i18n="agentLabel"></span>
            <div class="approval-selector" id="agent-selector" title="__MSG_selectAgent__">
              <span class="approval-name" id="agent-name">--</span>
              <svg class="approval-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
              <div class="approval-dropdown" id="agent-dropdown"></div>
            </div>
          </div>
          <div class="toolbar-group">
            <span class="toolbar-label" data-i18n="approvalLabel"></span>
            <div class="approval-selector" id="approval-selector" title="__MSG_selectApproval__">
              <span class="approval-name" id="approval-mode-name">--</span>
              <svg class="approval-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
              <div class="approval-dropdown" id="approval-dropdown"></div>
            </div>
          </div>
          <div class="toolbar-group meta-gauges">
            <div class="context-ring-wrap" id="context-ring-wrap">
              <svg class="context-ring" id="context-ring" viewBox="0 0 36 36">
                <circle class="rg-bg" cx="18" cy="18" r="15"></circle>
                <circle class="rg-fg" id="context-ring-fg" cx="18" cy="18" r="15"></circle>
              </svg>
              <div class="context-text">
                <div class="context-pct" id="context-pct">--</div>
                <div class="context-sub" id="context-sub"></div>
              </div>
              <div class="ctx-tooltip" id="context-tooltip" role="tooltip"></div>
            </div>
            <button class="ctx-compress-btn" id="ctx-compress-btn" title="__MSG_manualCompress__" hidden>
              <svg class="cc-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 10 2.5-2.5L8 10"/>
                <path d="m3 14 2.5 2.5L8 14"/>
                <path d="M13 6h8"/>
                <path d="M13 12h8"/>
                <path d="M13 18h8"/>
              </svg>
              <span class="cc-spinner"></span>
            </button>
            <span class="quota-text" id="quota-text"></span>
          </div>
        </div>
        <!-- 手动技能（豆包式底部技能）：点击“技能”弹出图片/视频生成入口 -->
        <div class="skill-bar" id="skill-bar"></div>
        <div class="attach-preview" id="attach-preview" hidden></div>
        <div class="composer" id="composer">
          <div class="slash-menu" id="slash-menu" hidden></div>
          <div class="ask-panel" id="ask-panel" hidden>
            <div class="ask-head">
              <span class="ask-title" data-i18n="askTitle"></span>
              <span class="ask-progress" id="ask-progress"></span>
              <button class="ask-close" id="ask-close" type="button" title="__MSG_askCancel__">&times;</button>
            </div>
            <div class="ask-stage" id="ask-stage"></div>
            <div class="ask-foot">
              <button class="btn" id="ask-prev" type="button" data-i18n="askPrev"></button>
              <button class="btn primary" id="ask-confirm" type="button"></button>
            </div>
          </div>
          <textarea id="input" rows="1" placeholder="__MSG_inputPlaceholder__"></textarea>
          <div class="attach-wrap">
            <button class="btn attach-add" id="attach-btn" type="button" title="__MSG_attachFile__">
              <svg class="aa-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <div class="attach-menu" id="attach-menu" hidden>
              <button class="attach-menu-item" id="attach-from-local" type="button" data-i18n="attachFromLocal"><span>从本机选择</span></button>
              <button class="attach-menu-item" id="attach-from-myzone" type="button" data-i18n="attachFromMyzone"><span>从 MyZone 选择</span></button>
            </div>
          </div>
          <button class="btn send" id="send-btn">
            <span data-i18n="send"></span>
          </button>
          <button class="btn stop" id="stop-btn" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            <span data-i18n="stop"></span>
          </button>
        </div>
      </div>
    </main>

    <!-- ========== Settings Panel ========== -->
    <div class="settings-overlay" id="settings-overlay"></div>
    <aside class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h3 data-i18n="settingsTitle"></h3>
        <button class="settings-close" id="settings-close">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <div class="settings-section-title" data-i18n="modelsSection"></div>
          <div class="settings-model-hint" data-i18n="modelsManageHint"></div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title" data-i18n="approvalSection"></div>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
            <label class="form-label" data-i18n="riskThresholdLabel"></label>
            <input type="range" id="risk-threshold" min="0" max="100" step="5" style="width: 100%; accent-color: var(--accent);">
            <div id="risk-threshold-value" style="font-size: 12px; color: var(--text-muted);"></div>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title" data-i18n="agentsSection"></div>
          <div class="agent-tabs" id="agent-tabs"></div>
          <button class="settings-btn secondary" id="new-agent-btn" data-i18n="newAgentBtn" style="width:100%;margin-top:10px;"></button>
          <div class="agent-editor" id="agent-editor"></div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title" data-i18n="customSkillsSection"></div>
          <div class="settings-model-hint" data-i18n="customSkillsSectionHint"></div>
          <button class="settings-btn secondary" id="new-skill-btn" data-i18n="newSkillBtn" style="width:100%;margin-bottom:10px;"></button>
          <div class="skill-list" id="custom-skill-list"></div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title" data-i18n="devSection"></div>
          <label class="dev-toggle-item">
            <input type="checkbox" id="dev-mode-toggle">
            <span>
              <span class="dev-toggle-title" data-i18n="devModeLabel"></span>
              <span class="dev-toggle-desc" data-i18n="devModeDesc"></span>
            </span>
          </label>
        </div>
      </div>
    </aside>
