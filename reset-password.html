<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="resetPassword.pageTitle">重置密码 - MyZone</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/site-chrome.css">
  <style>
    .reset-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
    }

    .reset-logo {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
      font-weight: 700;
      color: white;
    }

    .reset-card h2 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .reset-card .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .reset-card form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .reset-card .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      margin-top: 4px;
    }

    .reset-card .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .success-state {
      text-align: center;
    }

    .success-state .success-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-full);
      background-color: var(--success-light);
      color: var(--success-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .success-state .success-icon svg {
      width: 32px;
      height: 32px;
    }

    .success-state h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .success-state p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .error-state {
      text-align: center;
    }

    .error-state .error-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-full);
      background-color: var(--error-light);
      color: var(--error-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .error-state .error-icon svg {
      width: 32px;
      height: 32px;
    }

    .error-state h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .error-state p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .password-strength {
      height: 4px;
      background-color: var(--surface-light);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }

    .password-strength .strength-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease, background-color 0.3s ease;
      width: 0;
    }

    .password-strength .strength-bar.weak {
      width: 33%;
      background-color: var(--error-color);
    }

    .password-strength .strength-bar.medium {
      width: 66%;
      background-color: var(--warning-color);
    }

    .password-strength .strength-bar.strong {
      width: 100%;
      background-color: var(--success-color);
    }

    .password-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="dashboard-body" data-page="reset-password">
  <!-- 共享头部（由 js/site-chrome.js 注入） -->
  <div id="site-header"></div>

  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-logo">M</div>

      <!-- 加载状态 -->
      <div id="reset-loading" class="success-state">
        <h3 data-i18n="common.loading">加载中...</h3>
      </div>

      <!-- 重置密码表单 -->
      <div id="reset-form" class="hidden">
        <h2 data-i18n="resetPassword.title">重置密码</h2>
        <p class="subtitle" data-i18n="resetPassword.subtitle">请输入您的新密码</p>
        <form id="resetPasswordForm">
          <div class="form-group">
            <label for="newPassword" data-i18n="resetPassword.newPassword">新密码</label>
            <input type="password" id="newPassword" name="newPassword" data-i18n-placeholder="resetPassword.placeholder.password" placeholder="请输入新密码" required minlength="6">
            <div class="password-strength"><div id="strengthBar" class="strength-bar"></div></div>
            <p class="password-hint" data-i18n="resetPassword.passwordHint">至少 6 个字符</p>
          </div>
          <div class="form-group">
            <label for="confirmPassword" data-i18n="resetPassword.confirmPassword">确认新密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" data-i18n-placeholder="resetPassword.placeholder.confirmPassword" placeholder="请再次输入新密码" required minlength="6">
          </div>
          <div id="resetError" class="error-message hidden"></div>
          <button type="submit" id="resetSubmitBtn" class="btn btn-primary" data-i18n="resetPassword.submit">重置密码</button>
        </form>
      </div>

      <!-- 成功状态 -->
      <div id="reset-success" class="success-state hidden">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h3 data-i18n="resetPassword.successTitle">密码已重置</h3>
        <p data-i18n="resetPassword.successDesc">您的密码已成功重置，请使用新密码登录。</p>
        <a href="index.html" class="btn btn-primary" data-i18n="resetPassword.backToLogin">返回登录</a>
      </div>

      <!-- 错误状态 -->
      <div id="reset-error" class="error-state hidden">
        <div class="error-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h3 data-i18n="resetPassword.errorTitle">重置失败</h3>
        <p id="resetErrorMessage" data-i18n="resetPassword.invalidLink">重置链接无效或已过期。</p>
        <a href="index.html" class="btn btn-primary" data-i18n="resetPassword.backToLogin">返回登录</a>
      </div>
    </div>
  </div>

  <!-- 共享页脚（由 js/site-chrome.js 注入） -->
  <div id="site-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/site-chrome.js"></script>
  <script src="js/lib/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>

  <script>
    (async function() {
      const loadingEl = document.getElementById('reset-loading');
      const formEl = document.getElementById('reset-form');
      const successEl = document.getElementById('reset-success');
      const errorEl = document.getElementById('reset-error');
      const errorMessageEl = document.getElementById('resetErrorMessage');
      const resetForm = document.getElementById('resetPasswordForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const resetError = document.getElementById('resetError');
      const submitBtn = document.getElementById('resetSubmitBtn');
      const strengthBar = document.getElementById('strengthBar');

      // 初始化 Supabase 客户端
      const initialized = await appSupabase.ensureInitialized();
      if (!initialized) {
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        errorMessageEl.textContent = '网络连接失败，请检查网络设置';
        return;
      }

      try {
        // 1. 尝试从 URL 查询参数获取 token 和 email（直接链接方式）
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        const emailFromUrl = urlParams.get('email');
        const typeFromUrl = urlParams.get('type');

        let session = null;

        if (tokenFromUrl && emailFromUrl && typeFromUrl === 'recovery') {
          // 直接链接方式：用 Supabase 客户端验证 token（自动携带 apikey header）
          const { data: verifyData, error: verifyError } = await appSupabase.client.auth.verifyOtp({
            email: emailFromUrl,
            token: tokenFromUrl,
            type: 'recovery'
          });

          if (verifyError) {
            console.error('[ResetPassword] verifyOtp error:', verifyError);
            throw new Error('VERIFY_FAILED');
          }

          if (verifyData && verifyData.session) {
            session = verifyData.session;
          } else {
            // verifyOtp 成功但没返回 session，尝试获取
            const { data: sessionData } = await appSupabase.client.auth.getSession();
            if (sessionData && sessionData.session) {
              session = sessionData.session;
            } else {
              throw new Error('SESSION_NOT_FOUND');
            }
          }
        } else {
          // 2. 回退方式：检测 URL 中的 hash 片段（Supabase 重定向方式）
          const { data, error } = await appSupabase.client.auth.getSession();

          if (error) throw error;

          if (data && data.session) {
            session = data.session;
          } else {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token') && hash.includes('type=recovery')) {
              await new Promise(resolve => setTimeout(resolve, 2000));
              const { data: retryData } = await appSupabase.client.auth.getSession();
              if (retryData && retryData.session) {
                session = retryData.session;
              } else {
                throw new Error('SESSION_NOT_FOUND');
              }
            } else {
              throw new Error('SESSION_NOT_FOUND');
            }
          }
        }

        // 有有效会话，显示重置密码表单
        loadingEl.classList.add('hidden');
        formEl.classList.remove('hidden');

        // 密码强度检测
        newPasswordInput.addEventListener('input', () => {
          const val = newPasswordInput.value;
          if (val.length === 0) {
            strengthBar.className = 'strength-bar';
          } else if (val.length < 6) {
            strengthBar.className = 'strength-bar weak';
          } else if (val.length < 10) {
            strengthBar.className = 'strength-bar medium';
          } else {
            strengthBar.className = 'strength-bar strong';
          }
        });

        // 表单提交
        resetForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          resetError.classList.add('hidden');

          const newPassword = newPasswordInput.value;
          const confirmPassword = confirmPasswordInput.value;

          if (!newPassword || newPassword.length < 6) {
            resetError.textContent = '密码至少需要 6 个字符';
            resetError.classList.remove('hidden');
            return;
          }

          if (newPassword !== confirmPassword) {
            resetError.textContent = '两次输入的密码不一致';
            resetError.classList.remove('hidden');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = '重置中...';

          try {
            const { data: updateData, error: updateError } = await appSupabase.client.auth.updateUser({
              password: newPassword
            });

            if (updateError) {
              throw updateError;
            }

            // 显示成功状态
            formEl.classList.add('hidden');
            successEl.classList.remove('hidden');
          } catch (err) {
            resetError.textContent = err.message || '密码重置失败，请重试';
            resetError.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = '重置密码';
          }
        });
      } catch (err) {
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        
        if (err.message === 'SESSION_NOT_FOUND' || err.message === 'VERIFY_FAILED') {
          errorMessageEl.textContent = '重置链接无效或已过期，请重新发送重置密码邮件。';
        } else {
          errorMessageEl.textContent = err.message || '发生错误，请重试。';
        }
      }
    })();
  </script>
</body>
</html>
